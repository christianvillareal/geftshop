<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Geftshop Redirect</title>
    <script type="text/javascript">
      // Start the redirect from the correct base path.
      const base = '/geftshop'; 
      const path = window.location.pathname.replace(base, '');
      window.location.replace(`${base}/index.html?path=${encodeURIComponent(path)}`);
    </script>
  </head>
  <body></body>
</html>
