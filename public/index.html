<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Geftshop Clothing Store" />
    <title>Geftshop</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Handle the redirect from 404.html to the correct route -->
    <script>
      (function() {
        var urlParams = new URLSearchParams(window.location.search);
        var redirectPath = urlParams.get('path');
        if (redirectPath && redirectPath !== '/') {
          window.history.replaceState(null, '', redirectPath);
        }
      })();
    </script>
    <!--
      Your main React bundle script tags will go here...
    -->
  </body>
</html>
